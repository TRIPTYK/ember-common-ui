docs:
  sections:
    properties: "Properties"
    usage: "Usage"
    examples: "Examples"

  gettingStarted:
    title: "Getting Started"
    description: "ember-common-ui is a suite of Ember.js component libraries for building validated forms and rich UI layouts."
    packages:
      title: "Packages"
      emberInput: "Low-level input primitives (input, select, datepicker, file, etc.)."
      emberInputValidation: "Validated form prefabs built on ember-input and ember-immer-changeset with Zod schemas."
      emberUi: "High-level UI prefabs: dashboard layout, login/forgot-password/reset-password flows, forms, tables, and modals."
    quickStart:
      title: "Quick Start"
      description: "The example below shows a minimal validated form using ember-input-validation and ember-ui."

  installation:
    title: "Installation"
    description: "Install the packages you need. Each package only includes what it depends on — install them individually or all at once."
    all:
      title: "Install everything"
      description: "Install all three packages and their peer dependencies in one command:"
    emberInput:
      description: "Provides low-level input primitives. Requires the Tempus Dominus datepicker library."
      peers: "Peer dependencies: @eonasdan/tempus-dominus ^6.9.10, ember-source >=6.0.0"
    emberInputValidation:
      description: "Provides validated form prefabs. Requires ember-input and ember-immer-changeset."
      peers: "Peer dependencies: @triptyk/ember-input, ember-immer-changeset ^1.0.2, ember-source >=6.0.0"
    emberUi:
      description: "Provides high-level UI prefabs. Requires both ember-input and ember-input-validation."
      peers: "Peer dependencies: @triptyk/ember-input, @triptyk/ember-input-validation, ember-source >=6.0.0"

  propertyTable:
    name: "Name"
    type: "Type"
    required: "Required"
    description: "Description"
    yes: "Yes"
    no: "No"

emberInputValidation:
  prefabs:
    input:
      title: "Input"
      description: "This component provides a validated input field with label and error handling."
      examples:
        title: "Examples"
        basic: "Basic usage"
        masked: "With mask"
      properties:
        validationField:
          description: "The key in the changeset to read and write the field value."
        changeset:
          description: "An ImmerChangeset instance managing form state and validation errors."
        label:
          description: "Label text displayed above the input."
        placeholder:
          description: "Placeholder text shown when the input is empty."
        type:
          description: "HTML input type (text, email, password, number, etc.). Defaults to text."
        mandatory:
          description: "When true, displays a mandatory indicator (*) next to the label."
        mask:
          description: 'IMask pattern string for input masking (e.g. "+32 000 00 00 00").'
        maskOptions:
          description: "Additional options object passed to the IMask instance."
        unmaskValue:
          description: "When true, the raw (unmasked) value is passed to onChange instead of the formatted value."
        disabled:
          description: "When true, disables the input field."
        onChange:
          description: "Optional callback (value, event) => void. If omitted, the changeset field is updated automatically."
        changeEvent:
          description: 'DOM event that triggers onChange: "input" fires on every keystroke, "change" fires on blur. Defaults to "change".'
    number:
      title: "Number"
      description: "The number validation input can be blocked at a minimum of 0 or be a negative number."
      examples:
        title: "Examples"
        unsigned: "Unsigned Number"
        basic: "Basic usage"
    bic:
      title: "BIC"
      description: "This is an input with a built-in mask for BIC. The mask should be compatible for any BIC and text can only be in capital letters."
      examples:
        title: "Examples"
        basic: "Basic usage"
    currency:
      title: "Currency"
      description: "A reusable validation component for currency input with integrated error handling and euro formatting mask."
      examples:
        title: "Examples"
        basic: "Basic Currency"
    datepicker:
      title: "Datepicker"
      description: "A reusable validation component for date selection with integrated error handling and extensive customization options."
      examples:
        title: "Examples"
        basic: "Basic usage"
    datepickerRange:
      title: "Datepicker Range validation prefab"
      description: "A reusable validation component for date range selection with integrated error handling"
      examples:
        title: "Examples"
        basic: "Basic Datepicker Range"
    email:
      title: "Email"
      description: "A reusable validation component for email input with integrated error handling"
      examples:
        title: "Examples"
        basic: "Basic usage"
    file:
      title: "File"
      description: "A reusable validation component for single file upload with integrated error handling"
      examples:
        title: "Examples"
        basic: "Basic usage"
    fileList:
      title: "File List"
      description: "A reusable validation component for multiple file upload with drag and drop support, integrated error handling, and file management features"
      examples:
        title: "Examples"
        basic: "Basic usage"
    iban:
      title: "IBAN"
      description: "A reusable validation component for IBAN input with built-in mask supporting Belgian, French, Luxembourgish, Dutch and German IBANs with automatic formatting"
      examples:
        title: "Examples"
        basic: "Basic usage"
    integer:
      title: "Integer"
      description: "A reusable validation component for integer input that prevents decimal numbers and can be restricted to unsigned values (minimum 0) or allow negative numbers"
      examples:
        title: "Examples"
        basic: "Basic usage"
    mobile:
      title: "Mobile"
      description: "A reusable validation component for mobile phone numbers with country prefix support (Luxembourg, Germany, Netherlands, Belgium, France) and integrated error handling"
      examples:
        title: "Examples"
        basic: "Basic usage"
    nationalNumber:
      title: "National Number"
      description: "A reusable validation component for Belgian national number input with built-in mask that formats the number in the pretty format similar to the one on Belgian ID cards"
      examples:
        title: "Examples"
        basic: "Basic usage"
    password:
      title: "Password"
      description: "A reusable validation component for password input fields with secure masking and integrated error handling"
      examples:
        title: "Examples"
        basic: "Basic usage"
    radio:
      title: "Radio"
      description: "A reusable validation component for single radio button with integrated error handling"
      examples:
        title: "Examples"
        basic: "Basic usage"
    radioGroup:
      title: "Radio Group"
      description: "A reusable validation component for radio button groups with integrated error handling and customizable options"
      examples:
        title: "Examples"
        basic: "Basic usage"
    select:
      title: "Select"
      description: "A powerful select component with built-in validation using ember-power-select"
      examples:
        title: "Examples"
        basic: "Basic usage"
    selectCreate:
      title: "Select Create"
      description: "A powerful select component with ability to create new values and built-in validation using ember-power-select and ember-power-select-with-create"
      examples:
        title: "Examples"
        basic: "Basic usage"
    selectSearch:
      title: "Select Search"
      description: "A powerful select component with search and built-in validation using ember-power-select"
      examples:
        title: "Examples"
        basic: "Basic usage"
    textarea:
      title: "Textarea"
      description: "A reusable validation component for textarea fields with integrated error handling and optional character limit"
      examples:
        title: "Examples"
        basic: "Basic usage"
    timepicker:
      title: "Timepicker"
      description: "A reusable validation component for time selection with integrated error handling and customizable options"
      examples:
        title: "Examples"
        basic: "Basic usage"
    vat:
      title: "VAT"
      description: "An input component with built-in mask for VAT numbers supporting Belgian, French, Luxembourgish, Dutch and German VAT formats"
      examples:
        title: "Examples"
        basic: "Basic usage"
    checkbox:
      title: "Checkbox"
      description: "A validated checkbox component with label and integrated error handling."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        validationField:
          description: "The key in the changeset to read and write the checkbox value."
        changeset:
          description: "An ImmerChangeset instance managing form state and validation errors."
        label:
          description: "Label text displayed next to the checkbox."
        mandatory:
          description: "When true, displays a mandatory indicator (*) next to the label."
        disabled:
          description: "When true, the checkbox is non-interactive."
        onChange:
          description: "Callback called with the checked state, value, and native event when the checkbox changes."

ember-ui:
  prefabs:
    confirm-modal:
      title: "Confirm Modal"
      description: "A modal component for confirmation dialogs."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        onClose:
          description: "Callback called when the modal is dismissed without confirming."
        onConfirm:
          description: "Callback called when the user clicks the confirm button."
        cancelText:
          description: "Text label for the cancel button."
        confirmText:
          description: "Text label for the confirm button."
        confirmQuestion:
          description: "Question or message displayed in the modal body."
        isOpen:
          description: "Controls modal visibility. Set to true to open, false to close."
    tpk-table-generic-prefab:
      title: "Tpk Table Generic Prefab"
      description: "A generic table component with sorting, pagination, filtering, and customizable columns."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        tableParams:
          description: "Configuration object defining the table entity, columns, pagination, sorting, and actions."
        columnsComponent:
          description: "Map of component names to Glimmer components used for custom column cell rendering."
        entity:
          description: 'API endpoint path used to fetch table data (e.g. "/users").'
        pageSizes:
          description: "Available page size options shown in the pagination footer. Defaults to [5, 10, 25]."
        defaultSortColumn:
          description: "Column field to sort by on initial load."
        additionalFilters:
          description: "Static key-value pairs appended to every API request as query parameters."
        relationships:
          description: "Comma-separated relationship names to include in API requests."
        rowClick:
          description: "Callback fired when a table row is clicked. Receives the row data and DOM event."
        columns:
          description: "Array of column definitions with field path, header label, sortable flag, and optional component name."
        actionMenu:
          description: "Array of action menu items, each with a name, optional icon component, and action callback."
    tpk-dashboard:
      title: "Tpk Dashboard"
      description: "A full-page dashboard layout combining a navbar and collapsible sidebar."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        title:
          description: "Application title displayed in the navbar."
        sidebarItems:
          description: "Array of sidebar navigation items (links or groups)."
        navbarItems:
          description: "Array of navbar navigation items."
        currentUser:
          description: "Current user object with a fullName property for the profile menu."
        onLogout:
          description: "Callback called when the user clicks the logout button."
        logoutLabel:
          description: "Label for the logout button."
        profileRoute:
          description: "Route name for the profile link."
        profileLabel:
          description: "Label for the profile link."
        drawerId:
          description: "ID of the drawer input element. Defaults to 'tpk-dashboard-drawer'."
        collapsed:
          description: "Controls the collapsed state of the sidebar."
        onCollapsedChange:
          description: "Callback called when the sidebar collapsed state changes."
        onSidebarToggle:
          description: "Callback called when the sidebar toggle button is clicked."
        languages:
          description: "Array of available languages with code and label."
        onLocaleChange:
          description: "Callback called when the user selects a different language."
    tpk-login:
      title: "Tpk Login"
      description: "A ready-to-use login form with email and password fields backed by Zod validation."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        onSubmit:
          description: "Callback called with validated data and the changeset on successful submission."
        loginSchema:
          description: "A Zod object schema with email and password fields used to validate the form."
        initialValues:
          description: "Optional initial values for the email and password fields."
        submitButtonText:
          description: "Label for the submit button. Defaults to 'Sign in'."
    tpk-reset-password:
      title: "Tpk Reset Password"
      description: "A ready-to-use reset password form with password and confirm password fields backed by Zod validation."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        onSubmit:
          description: "Callback called with validated data and the changeset on successful submission."
        resetPasswordSchema:
          description: "A Zod object schema with password and confirmPassword fields used to validate the form."
        initialValues:
          description: "Optional initial values for the password and confirmPassword fields."
        submitButtonText:
          description: "Label for the submit button. Defaults to 'Reset Password'."
    tpk-forgot-password:
      title: "Tpk Forgot Password"
      description: "A ready-to-use forgot password form with an email field backed by Zod validation."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        onSubmit:
          description: "Callback called with validated data and the changeset on successful submission."
        forgotPasswordSchema:
          description: "A Zod object schema with an email field used to validate the form."
        initialValues:
          description: "Optional initial values for the email field."
        submitButtonText:
          description: "Label for the submit button. Defaults to 'Send reset link'."
    tpk-form:
      title: "Tpk Form"
      description: "A comprehensive form component that integrates validation using ember-immer-changeset and zod."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        changeset:
          description: "An ImmerChangeset instance holding form state and validation errors."
        onSubmit:
          description: "Callback called with validated data and the changeset after successful validation."
        validationSchema:
          description: "A Zod object schema used to validate the changeset on submit."
        reactive:
          description: "When true, validates individual fields on change instead of waiting for submit."
        removeErrorsOnSubmit:
          description: "When true, clears all errors before running validation on submit."
        autoScrollOnError:
          description: "When true, scrolls to the first field with an error after failed validation."
        disabled:
          description: "When true, disables all yielded input components."
        executeOnValid:
          description: "When true, calls onSubmit only if all fields pass validation."
    tpk-navbar:
      title: "Tpk Navbar"
      description: "A ready-to-use top navigation bar with support for branding, navigation links, language switching, and user menu."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        title:
          description: "Application title displayed in the navbar."
        navbarItems:
          description: "Array of navigation items. Each item has a label and an optional href or onClick handler."
        drawerId:
          description: "ID linking the navbar toggle button to a sidebar drawer."
        onSidebarToggle:
          description: "Callback called when the sidebar toggle button is clicked."
        languages:
          description: "Array of available languages with code and label for the language switcher."
        onLocaleChange:
          description: "Callback called with the selected locale code when the user changes language."
        currentUser:
          description: "Currently authenticated user object with a fullName property for the user menu."
        onLogout:
          description: "Callback called when the user clicks the logout button."
        logoutLabel:
          description: "Label for the logout menu item. Defaults to 'Logout'."
        profileRoute:
          description: "Ember route name to navigate to when the user clicks the profile menu item."
        profileLabel:
          description: "Label for the profile menu item. Defaults to 'Profile'."
    tpk-sidebar:
      title: "Tpk Sidebar"
      description: "A collapsible sidebar navigation component supporting links, groups, icons, and tooltips."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        sidebarItems:
          description: "Array of sidebar items. Each item is either a SidebarLink or a SidebarGroup with nested items."
        drawerId:
          description: "ID used to associate the sidebar with a navbar toggle button via drawer."
        collapsed:
          description: "Controls the collapsed state of the sidebar."
        onCollapsedChange:
          description: "Callback called with the new collapsed boolean when the user toggles the sidebar."
    tpk-theme-selector:
      title: "Tpk Theme Selector"
      description: "A theme switcher component that persists the selected theme to localStorage."
      examples:
        title: "Examples"
        basic: "Basic usage"
      properties:
        themes:
          description: "Array of theme name strings to display as options."
        localStorageKey:
          description: "Key used to persist the selected theme in localStorage. Defaults to 'theme'."
        sidebarCollapsed:
          description: "When true, renders the selector in compact mode suitable for a collapsed sidebar."

emberInput:
  prefabs:
    button:
