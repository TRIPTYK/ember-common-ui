name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: wyvox/action-setup-pnpm@v3
      - name: Build
        run: pnpm turbo build --filter='@triptyk/ember-*'
      - name: Run tests
        run: pnpm turbo lint test
